[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mammogen"
version = "1.0.0"
description = "MammoGen — mammography diffusion generation with automated QC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "TraitYoung" }]
keywords = ["mammography", "diffusion", "lora", "medical-imaging", "qc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Heavy ML stack stays in requirements.txt; core install is importable scaffolding.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]
full = [
  "accelerate>=0.28.0",
  "diffusers>=0.27.0",
  "fastapi>=0.110.0",
  "gradio>=4.0.0",
  "numpy>=1.24.0",
  "opencv-python>=4.8.0",
  "pandas>=2.0.0",
  "peft>=0.10.0",
  "pillow>=10.0.0",
  "pydantic>=2.0.0",
  "scipy>=1.11.0",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "tqdm>=4.66.0",
  "transformers>=4.38.0",
  "torch-fidelity>=0.3.4",
  "pytorch-fid>=0.3.0",
  "piq>=0.7.0",
  "uvicorn>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/TraitYoung/medi-diff"
Repository = "https://github.com/TraitYoung/medi-diff"
Issues = "https://github.com/TraitYoung/medi-diff/issues"
HuggingFace = "https://huggingface.co/TraitYoung"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "apps*"]
exclude = ["scripts.tests*"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
  "heavy: needs torch / full ML stack (skipped in default CI)",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["scripts", "apps"]
extend-exclude = ["archive", "medi-diff-demonstration", "hf"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/**" = ["E402"]
"apps/app_gradio.py" = ["E402"]
"apps/api_server.py" = ["E402"]
